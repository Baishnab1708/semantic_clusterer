[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic_clusterer"
version = "0.1.0"
description = "A lightweight, high-performance Python library for unsupervised semantic grouping of text at scale"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "semantic_clusterer contributor" }
]
keywords = [
    "nlp",
    "clustering",
    "semantic",
    "text",
    "embeddings",
    "hdbscan",
    "unsupervised",
    "machine-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "numpy>=1.21.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.8.0",
    "hdbscan>=0.8.29",
    "umap-learn>=0.5.3",
    "onnxruntime>=1.15.0",
    "tokenizers>=0.13.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.1.0",
    "hypothesis>=6.0",
]

[project.urls]
Homepage = "https://github.com/Baishnab1708/semantic_clusterer"
Documentation = "https://Baishnab1708.github.io/semantic_clusterer/"
Repository = "https://github.com/Baishnab1708/semantic_clusterer"
Issues = "https://github.com/Baishnab1708/semantic_clusterer/issues"

[tool.hatch.build.targets.wheel]
packages = ["semantic_clusterer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "benchmark: marks tests as benchmark/regression tests (deselect with '-m not benchmark')",
    "integration: marks tests as integration tests that may be slow (deselect with '-m not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
